# Testing path filters
name: My First Workflow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'   
  pull_request:
    branches:
      - main 
    paths:
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      greeting:
        description: "What greeting should we use?"
        type: string
        required: true
        default: "Hello"

      your_name: 
        description: "What is your name?"
        type: string
        required: true



jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Say Hello
        run: echo "Hello from GitHub Actions"

      - name: Show some information
        run:  |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"

      - name: Show date info
        run: date       

      - name: Custom greeting
        run: echo "${{ github.event.inputs.greeting }}, ${{ github.event.inputs.your_name }}!"
