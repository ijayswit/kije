name: My Pipeline

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run lint
        run: echo "Running linter..."

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.JS
        uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: '20'

      - name: Print Node version
        run: echo "Node version is ${{ steps.setup-node.outputs.node-version }}"   

      - name: Run tests
        run: echo "Running tests..."


  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run security scan
        run: echo "Running security scan..."

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Build
        run: echo "Building the application..."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - name: Deploy application
        run: echo "Deploying application to production.."